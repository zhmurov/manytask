        :root { color-scheme: light; }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            color: #202b35;
            background: #fffcf7;
            font: 400 18px/1.55 "Nunito Sans", system-ui, sans-serif;
            font-synthesis: none;
        }
        .page {
            min-height: 100vh;
            min-height: 100svh;
            max-width: 1040px;
            margin: auto;
            padding: 32px 48px 24px;
            display: flex;
            flex-direction: column;
        }
        .brand { display: inline-flex; width: fit-content; padding: 8px; }
        .brand img { display: block; width: 168px; height: auto; }
        main {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            align-items: center;
            gap: 40px;
            padding: 48px 0;
        }
        h1 {
            margin: 0 0 20px;
            font-size: clamp(30px, 3.5vw, 42px);
            font-weight: 600;
            letter-spacing: -0.025em;
            line-height: 1.17;
        }
        .description { max-width: 380px; margin: 0; color: #52616c; }
        .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 28px; }
        .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 48px;
            padding: 11px 20px;
            border: 1px solid #17c3b2;
            border-radius: 10px;
            background: #17c3b2;
            color: #202b35;
            font: 600 16px/1.5 "Nunito Sans", system-ui, sans-serif;
            text-decoration: none;
        }
        .button:hover { background: #12b3a3; border-color: #12b3a3; }
        .secondary { border-color: #ced4d7; background: transparent; }
        .secondary:hover { border-color: #52616c; background: #f2ede5; }
        a:focus-visible { outline: 3px solid #202b35; outline-offset: 5px; }
        .illustration { display: block; width: 100%; height: auto; max-height: 360px; object-fit: contain; }
        @media (max-width: 700px) {
            .page { padding: 20px 24px; }
            .brand img { width: 160px; }
            main { grid-template-columns: 1fr; gap: 24px; padding: 24px 0; align-content: center; }
            .illustration { grid-row: 1; width: min(100%, 300px); max-height: 230px; margin: auto; }
            .copy { max-width: 480px; margin: auto; width: 100%; }
            h1 { margin-bottom: 16px; }
        }
