# Server-level include used by nginx-proxy for hosts without custom vhost files.
# Keep proxy_intercept_errors off: application/API responses retain their bodies.
error_page 500 /internal.html;
error_page 502 503 /unavailable.html;
error_page 504 /timeout.html;

location ~ ^/(50x|internal|unavailable|timeout)\.html$ {
    internal;
    root /usr/share/nginx/html/errors;
    add_header Cache-Control "no-store" always;
}
